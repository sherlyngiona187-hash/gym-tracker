{% extends "base.html" %}
{% block title %}Members — GymTrack Pro{% endblock %}
{% block page_title %}Members{% endblock %}

{% block content %}
<div class="page-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <p class="page-subtitle">Manage gym members and their profiles</p>
    <button class="btn btn-primary" onclick="openMemberModal()">
        <i data-lucide="plus"></i> Add Member
    </button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="data-table" id="membersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Height</th>
                    <th>Trainer</th>
                    <th>Joined</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="membersBody"></tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadMembers);

async function loadMembers() {
    const res = await fetch('/api/members');
    const members = await res.json();
    const tbody = document.getElementById('membersBody');
    tbody.innerHTML = members.map(m => `
        <tr>
            <td>${m.Member_ID}</td>
            <td><strong>${m.Name}</strong></td>
            <td>${m.Age}</td>
            <td><span class="badge badge-${m.Gender === 'Male' ? 'blue' : 'pink'}">${m.Gender}</span></td>
            <td>${m.Phone}</td>
            <td>${m.Email}</td>
            <td>${m.Height} cm</td>
            <td>${m.Trainer_Name || '<span class="text-muted">None</span>'}</td>
            <td>${m.Join_Date}</td>
            <td class="actions">
                <button class="btn-icon btn-edit" onclick='openMemberModal(${JSON.stringify(m)})' title="Edit">
                    <i data-lucide="pencil"></i>
                </button>
                <button class="btn-icon btn-delete" onclick="deleteMember(${m.Member_ID})" title="Delete">
                    <i data-lucide="trash-2"></i>
                </button>
            </td>
        </tr>
    `).join('');
    lucide.createIcons();
}

async function openMemberModal(m = null) {
    const isEdit = !!m;
    document.getElementById('modalTitle').textContent = isEdit ? 'Edit Member' : 'Add Member';
    
    // Fetch trainers for dropdown
    const tRes = await fetch('/api/trainers');
    const trainers = await tRes.json();
    const trainerOptions = trainers.map(t => 
        `<option value="${t.Trainer_ID}" ${isEdit && m.Trainer_ID === t.Trainer_ID ? 'selected' : ''}>${t.Trainer_Name}</option>`
    ).join('');

    document.getElementById('modalBody').innerHTML = `
        <form id="memberForm" onsubmit="saveMember(event, ${isEdit ? m.Member_ID : 'null'})">
            <div class="form-grid">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="Name" value="${isEdit ? m.Name : ''}" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="Age" value="${isEdit ? m.Age : ''}" min="15" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="Gender" required>
                        <option value="Male" ${isEdit && m.Gender === 'Male' ? 'selected' : ''}>Male</option>
                        <option value="Female" ${isEdit && m.Gender === 'Female' ? 'selected' : ''}>Female</option>
                        <option value="Other" ${isEdit && m.Gender === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="Phone" value="${isEdit ? m.Phone : ''}" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="Email" value="${isEdit ? m.Email : ''}" required>
                </div>
                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" step="0.1" name="Height" value="${isEdit ? m.Height : ''}" required>
                </div>
                <div class="form-group">
                    <label>Assigned Trainer</label>
                    <select name="Trainer_ID">
                        <option value="">-- No Trainer --</option>
                        ${trainerOptions}
                    </select>
                </div>
                ${!isEdit ? `<div class="form-group">
                    <label>Join Date</label>
                    <input type="date" name="Join_Date" value="${new Date().toISOString().split('T')[0]}" required>
                </div>` : ''}
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">${isEdit ? 'Update' : 'Add'} Member</button>
            </div>
        </form>
    `;
    openModal();
    lucide.createIcons();
}

async function saveMember(e, id) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd);
    const url = id ? `/api/members/${id}` : '/api/members';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
        method, headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    if (result.success) {
        showToast(id ? 'Member updated!' : 'Member added!', 'success');
        closeModal();
        loadMembers();
    } else {
        showToast('Error: ' + result.error, 'error');
    }
}

async function deleteMember(id) {
    if (!confirm('Delete this member and all related records?')) return;
    const res = await fetch(`/api/members/${id}`, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) {
        showToast('Member deleted!', 'success');
        loadMembers();
    } else {
        showToast('Error: ' + result.error, 'error');
    }
}
</script>
{% endblock %}
