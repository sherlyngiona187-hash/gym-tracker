{% extends "base.html" %}
{% block title %}Workout Plans — GymTrack Pro{% endblock %}
{% block page_title %}Workout Plans{% endblock %}

{% block content %}
<div class="page-header">
    <p class="page-subtitle">Manage workout plans and assign to members</p>
    <button class="btn btn-primary" onclick="openWorkoutModal()">
        <i data-lucide="plus"></i> Add Workout Plan
    </button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="data-table" id="workoutsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Goal</th>
                    <th>Duration</th>
                    <th>Difficulty</th>
                    <th>Member</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="workoutsBody"></tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadWorkouts);

async function loadWorkouts() {
    const res = await fetch('/api/workouts');
    const workouts = await res.json();
    const tbody = document.getElementById('workoutsBody');
    tbody.innerHTML = workouts.map(w => `
        <tr>
            <td>${w.Workout_ID}</td>
            <td><strong>${w.Goal}</strong></td>
            <td>${w.Duration_Weeks} weeks</td>
            <td><span class="badge badge-${w.Difficulty_Level === 'Advanced' ? 'red' : w.Difficulty_Level === 'Intermediate' ? 'amber' : 'green'}">${w.Difficulty_Level}</span></td>
            <td>${w.Member_Name || '<span class="text-muted">Unassigned</span>'}</td>
            <td class="actions">
                <button class="btn-icon btn-edit" onclick='openWorkoutModal(${JSON.stringify(w)})' title="Edit">
                    <i data-lucide="pencil"></i>
                </button>
                <button class="btn-icon btn-delete" onclick="deleteWorkout(${w.Workout_ID})" title="Delete">
                    <i data-lucide="trash-2"></i>
                </button>
            </td>
        </tr>
    `).join('');
    lucide.createIcons();
}

async function openWorkoutModal(w = null) {
    const isEdit = !!w;
    document.getElementById('modalTitle').textContent = isEdit ? 'Edit Workout Plan' : 'Add Workout Plan';

    // Fetch members for dropdown
    const mRes = await fetch('/api/members');
    const members = await mRes.json();
    const memberOptions = members.map(m => 
        `<option value="${m.Member_ID}" ${isEdit && w.Member_ID === m.Member_ID ? 'selected' : ''}>${m.Name} (ID: ${m.Member_ID})</option>`
    ).join('');

    document.getElementById('modalBody').innerHTML = `
        <form onsubmit="saveWorkout(event, ${isEdit ? w.Workout_ID : 'null'})">
            <div class="form-grid">
                <div class="form-group">
                    <label>Select Member</label>
                    <select name="Member_ID" required>
                        <option value="">-- Select Member --</option>
                        ${memberOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label>Goal</label>
                    <input type="text" name="Goal" value="${isEdit ? w.Goal : ''}" required>
                </div>
                <div class="form-group">
                    <label>Duration (Weeks)</label>
                    <input type="number" name="Duration_Weeks" value="${isEdit ? w.Duration_Weeks : ''}" required>
                </div>
                <div class="form-group">
                    <label>Difficulty Level</label>
                    <select name="Difficulty_Level" required>
                        <option value="Beginner" ${isEdit && w.Difficulty_Level === 'Beginner' ? 'selected' : ''}>Beginner</option>
                        <option value="Intermediate" ${isEdit && w.Difficulty_Level === 'Intermediate' ? 'selected' : ''}>Intermediate</option>
                        <option value="Advanced" ${isEdit && w.Difficulty_Level === 'Advanced' ? 'selected' : ''}>Advanced</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">${isEdit ? 'Update' : 'Add'} Plan</button>
            </div>
        </form>
    `;
    openModal();
    lucide.createIcons();
}

async function saveWorkout(e, id) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd);
    const url = id ? `/api/workouts/${id}` : '/api/workouts';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    const result = await res.json();
    if (result.success) { showToast(id ? 'Plan updated!' : 'Plan added!', 'success'); closeModal(); loadWorkouts(); }
    else showToast('Error: ' + result.error, 'error');
}

async function deleteWorkout(id) {
    if (!confirm('Delete this workout plan?')) return;
    const res = await fetch(`/api/workouts/${id}`, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) { showToast('Plan deleted!', 'success'); loadWorkouts(); }
    else showToast('Error: ' + result.error, 'error');
}
</script>
{% endblock %}
